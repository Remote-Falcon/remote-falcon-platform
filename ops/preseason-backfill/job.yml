---
# One-off PRD-013 P0-6a backfill. Runs in-cluster because prod Mongo is
# DO Managed and VPC-restricted — a laptop cannot reach it.
#
# The script is mounted from a ConfigMap built out of the repo copy, so
# what runs is what is reviewed here:
#
#   kubectl -n remote-falcon create configmap preseason-backfill \
#     --from-file=backfill.py=ops/preseason-backfill/backfill.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n remote-falcon apply -f ops/preseason-backfill/job.yml
#   kubectl -n remote-falcon logs -f job/preseason-backfill
#
# Defaults to a dry run. To write, edit ARGS below and re-create the Job
# (a completed Job is immutable — delete it first).
apiVersion: batch/v1
kind: Job
metadata:
  name: preseason-backfill
  namespace: remote-falcon
  labels:
    app: preseason-backfill
spec:
  backoffLimit: 0          # a partial re-run would re-send capture batches
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: preseason-backfill
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          # slim, not alpine: pymongo ships manylinux wheels, so no
          # compiler is needed on glibc.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-connection
                  key: MONGO_URI
            # Public ingest key (same value the UI bakes in). Not a secret.
            - name: POSTHOG_HOST
              value: https://us.i.posthog.com
            # WRITE RUN as committed: sets Show.marketingOptIn on shows
            # that were never asked, and pushes every eligible person to
            # PostHog with preseasonWave stamped. Set back to "" for a
            # dry run. Re-running is safe (Mongo touches nulls only, the
            # capture is an idempotent $set) but re-sends 2615 events.
            - name: ARGS
              value: "--apply-mongo --apply-posthog"
          command: ["/bin/sh", "-uec"]
          args:
            - |
              pip install --quiet --no-cache-dir 'pymongo>=4.6'
              python /script/backfill.py $ARGS
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: preseason-backfill
