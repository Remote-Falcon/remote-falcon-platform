# Season capacity profiles: replicas, HPA bounds, requests and limits per
# service. This file is the single source for the sizes that deploy.yml
# applies (it used to be a hard-coded `case` in the deploy job) and for the
# ingress-nginx controller's replica bounds (ops/k8s/ingress-nginx/apply.sh).
#
# Read by ops/season/resolve.sh; tested by ops/season/resolve.test.sh.
# Policy and calendar: docs/SERVICES.md "Season knobs".
#
# `active` names the profile every deploy uses unless a workflow_dispatch run
# picks one with `-f profile=<name>`. Change it here (and merge) when the
# season changes, so later push and hotfix deploys keep the same sizes.
#
# Rows: PROFILE SERVICE REPLICAS MIN MAX REQ_MEM REQ_CPU LIM_MEM LIM_CPU
#   off-season must list every service with every column filled in.
#   Other profiles list only what they change:
#     .  = same as off-season
#     -  = not managed by this file (ingress-nginx requests/limits)
#   REPLICAS is the fixed count for non-HPA services (ui, mongo-backup,
#   account-archive). HPA services have no `replicas:` in their manifest, so
#   only MIN/MAX reach them (via the HPA).

# Calendar: season from R1 (Nov 16), peak from Mon Dec 14 (with standbys),
# back to off-season Jan 5.
active season

# off-season. Requests re-sized 2026-08-22 from live usage (the legacy values
# booked 3-8x what the pods use and filled the nodes' request ledger). Limits
# are the safety ceiling: the JVM services derive their heap from the
# container limit, so cutting a limit cuts the heap.
# viewer + plugins-api (Appendix D P0-4 / P1-3, 2026-10-13): floor 2 so one
# pod loss or node drain never leaves zero; max 4 bounded by the Mongo
# connection budget (4 pods x 15 pooled connections each). CPU requests sit
# so the 85% HPA target is above normal show-night load (7-day p95/max per
# pod: plugins-api 132m/188m, viewer 69m/84m).
#
# profile    service          repl min max  req_mem req_cpu lim_mem lim_cpu
off-season   ui               2    2   2    64Mi    20m     128Mi   100m
off-season   control-panel    2    2   4    256Mi   200m    512Mi   500m
off-season   viewer           2    2   4    160Mi   150m    320Mi   500m
off-season   plugins-api      2    2   4    192Mi   250m    384Mi   750m
off-season   external-api     2    2   4    256Mi   100m    512Mi   500m
off-season   mongo-backup     1    1   1    128Mi   25m     750Mi   200m
off-season   account-archive  1    1   1    64Mi    10m     384Mi   100m
off-season   ingress-nginx    2    2   2    -       -       -       -

# season: Nov 16 (R1) to Dec 13, and again Dec 28 to Jan 4. HPA ceilings
# raised so a busy night can scale out; floors stay low except plugins-api,
# which flaps 2->3->2 at the top of most show hours.
season       viewer           .    2   20   .       .       .       .
season       plugins-api      .    3   8    .       .       .       .
season       external-api     .    .   6    .       .       .       .
season       ingress-nginx    .    2   6    -       -       -       -

# peak: Dec 14 through Dec 27 (Season Prep - November Build Plan), with the
# DB standbys. Pair with the node autoscaler max 8 (doctl, not in this file).
peak         viewer           .    4   20   .       .       .       .
peak         plugins-api      .    3   8    .       .       .       .
peak         external-api     .    .   6    .       .       .       .
peak         ingress-nginx    .    3   6    -       -       -       -
