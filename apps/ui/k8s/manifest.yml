---
apiVersion: v1
kind: Namespace
metadata:
  name: #{Namespace}#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  replicas: #{Replicas}#
  selector:
    matchLabels:
      app: #{Application}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{Application}#
    spec:
      containers:
      - name: #{Application}#
        image: #{Image}#
        resources:
          requests:
            memory: #{Requests.Memory}#
            cpu: #{Requests.CPU}#
          limits:
            memory: #{Limits.Memory}#
            cpu: #{Limits.CPU}#
        ports:
        - containerPort: 3000
        startupProbe:
          httpGet:
            path: /health.json
            port: 3000
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /health.json
            port: 3000
          initialDelaySeconds: 0
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health.json
            port: 3000
          failureThreshold: 3
          initialDelaySeconds: 0
      imagePullSecrets:
        - name: remote-falcon-ghcr
---
apiVersion: v1
kind: Service
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  type: ClusterIP
  ports:
  - port: 3000
  selector:
    app: #{Application}#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  annotations:
    kubernetes.io/ingress.class: nginx
    # PostHog reverse proxy. ~25-30% of real users (Brave, NextDNS,
    # Pi-hole, AdGuard, uBlock with strict lists) block requests by URL
    # pattern to us.i.posthog.com — bypass by routing through our own
    # origin. Matches the same `/ingest/` routes in ops/dev-nginx.conf
    # so the SDK config (api_host: '/ingest') is identical in dev + prod.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ^~ /ingest/static/ {
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        proxy_pass            https://us-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header      Host us-assets.i.posthog.com;
        proxy_redirect        off;
        proxy_buffering       on;
      }
      location ^~ /ingest/ {
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        proxy_pass            https://us.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header      Host us.i.posthog.com;
        proxy_redirect        off;
        proxy_buffering       on;
      }
spec:
  tls:
  - hosts:
    - #{Host}#
    - '#{SubdomainHost}#'
    secretName: remote-falcon-tls
  rules:
  - host: #{Host}#
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: #{Application}#
            port:
              number: 3000
  - host: '#{SubdomainHost}#'
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: #{Application}#
            port:
              number: 3000
