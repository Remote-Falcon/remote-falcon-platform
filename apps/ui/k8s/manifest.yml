---
apiVersion: v1
kind: Namespace
metadata:
  name: #{Namespace}#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  replicas: #{Replicas}#
  selector:
    matchLabels:
      app: #{Application}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{Application}#
    spec:
      # B-2 (2026-08-22 audit): don't stack both replicas on one node.
      # ScheduleAnyway = prefer spreading but never block scheduling on a
      # small/busy cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: #{Application}#
      containers:
      - name: #{Application}#
        image: #{Image}#
        resources:
          requests:
            memory: #{Requests.Memory}#
            cpu: #{Requests.CPU}#
          limits:
            memory: #{Limits.Memory}#
            cpu: #{Limits.CPU}#
        ports:
        - containerPort: 3000
        startupProbe:
          httpGet:
            path: /health.json
            port: 3000
          # Static file server — up in seconds. 5s x 24 = 2 min ceiling; the
          # old default-period 10s x 120 allowed a 20-minute silent hang.
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /health.json
            port: 3000
          initialDelaySeconds: 0
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health.json
            port: 3000
          failureThreshold: 3
          initialDelaySeconds: 0
      imagePullSecrets:
        - name: remote-falcon-ghcr
---
apiVersion: v1
kind: Service
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  type: ClusterIP
  ports:
  - port: 3000
  selector:
    app: #{Application}#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  annotations:
    kubernetes.io/ingress.class: nginx
    # Note: the PostHog same-origin /ingest reverse proxy that lived here
    # was removed because the cluster admin disabled the
    # nginx.ingress.kubernetes.io/configuration-snippet annotation
    # cluster-wide. SDK now calls us.i.posthog.com directly (see
    # apps/ui/src/index.jsx). Tradeoff: ~25-30% of users on ad blockers
    # will silently drop events. A snippet-free reimplementation is
    # tracked as issue #130.
spec:
  tls:
  - hosts:
    - #{Host}#
    - '#{SubdomainHost}#'
    secretName: remote-falcon-tls
  rules:
  - host: #{Host}#
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: #{Application}#
            port:
              number: 3000
  - host: '#{SubdomainHost}#'
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: #{Application}#
            port:
              number: 3000
---
# B-2 (2026-08-22 audit): per-app disruption budget so a node drain always
# leaves at least one replica serving. Only multi-replica services get one --
# a PDB with minAvailable on a 1-replica deployment blocks drains outright.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: #{Application}#
