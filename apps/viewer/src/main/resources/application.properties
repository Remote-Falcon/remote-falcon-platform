quarkus.package.jar.enabled=true
quarkus.http.root-path=/remote-falcon-viewer
quarkus.http.port=8080
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
# Worker pool cap, ~3x the Mongo pool (15). The default (max(200, 8 x cores))
# let every blocked request pile onto the DB; excess now queues briefly or
# fails fast on the 1s pool wait.
quarkus.thread-pool.max-threads=48

#MongoDB
quarkus.mongodb.database=remote-falcon
quarkus.mongodb.connection-string=${MONGO_URI}
# Fail fast instead of queueing (Season Capacity Plan, Appendix D §3, after
# the 2026-10-12 saturation). Driver defaults were 30s server selection, 10s
# connect, no read timeout, 100-connection pool and a 2-minute pool wait, so
# every worker thread parked on a slow DB. Pool size bounds this pod's share
# of the DB connection budget; min 2 keeps a warm connection without a
# reconnect storm on recovery (was 5, PERF-FIX-PLAN.md Fix 4).
quarkus.mongodb.server-selection-timeout=2S
quarkus.mongodb.connect-timeout=2S
quarkus.mongodb.read-timeout=5S
quarkus.mongodb.max-pool-size=15
quarkus.mongodb.min-pool-size=2
# Pool wait (driver maxWaitTime). No quarkus.mongodb.* property exists for it,
# so MongoClientTuning applies this at runtime. This is the bulkhead.
remotefalcon.mongodb.wait-queue-timeout=1S
# MONGO_SLOW log line threshold (SlowCommandListener). 0 disables.
remotefalcon.mongodb.slow-command-threshold=250ms
# Keep Mongo out of /q/health/ready. The SmallRye check pinged a reactive
# client nothing else uses (a second pool per pod) and marked every pod
# unready while the DB was slow. Build-time property: needs the rebuild every
# deploy does anyway.
quarkus.mongodb.health.enabled=false
# Pool gauges (checked-out, wait queue) on /q/metrics via Micrometer.
quarkus.mongodb.metrics.enabled=true
# Show.pages[].pageId (added in the RF Page Builder Phase 1 schema change) is
# the only java.util.UUID field across the whole schema. Spring Data Mongo
# writes it as BSON Binary subtype 3 (legacy Java layout). mongo-java-driver 5
# defaults uuidRepresentation=UNSPECIFIED, which refuses to decode subtype 3
# and throws BSONException: "Unexpected UUID representation: UNSPECIFIED" —
# the entire Show fails to deserialize and getShow / getShowForViewer surfaces
# as a "System error". Aligning the Quarkus reader with the Spring writer
# closes the asymmetry.
quarkus.mongodb.uuid-representation=JAVA_LEGACY

#Component Scans
quarkus.index-dependency.remote-falcon-library.group-id=com.remotefalcon
quarkus.index-dependency.remote-falcon-library.artifact-id=remote-falcon-library

#OpTel — ship OTLP/gRPC to a cluster-local OTel Collector (the modern
# replacement for the now-retired Datadog Agent the previous maintainer
# pointed this at). The collector owns auth + protocol conversion + routing
# to the cloud destination (PostHog Logs over HTTP).
#
# OTEL_URI defaults to the local compose collector; prod k8s overrides
# it to the in-cluster service DNS name.
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_URI:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.resource.attributes=service.name=remote-falcon-viewer,deployment.environment=prod
quarkus.application.name=remote-falcon-viewer
quarkus.otel.instrument.graphql=true
quarkus.smallrye-graphql.tracing.enabled=true

# Surface exporter failures (drops, timeouts, etc.) at WARN. The previous
# maintainer had this at OFF, which is exactly why the broken Datadog
# pipeline ran silently for an unknown stretch of time.
quarkus.log.category."io.quarkus.opentelemetry.runtime".level=WARN

#CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-max-age=604800

# Native build defaults (avoid platform expansion issues)
quarkus.native.builder-image=graalvm

# Logging configuration for native images
quarkus.log.level=INFO
quarkus.log.category."com.remotefalcon".level=INFO
quarkus.native.enable-all-security-services=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true