quarkus.package.jar.enabled=false
quarkus.http.root-path=/remote-falcon-account-archive
quarkus.http.port=8080

#MongoDB
quarkus.mongodb.database=remote-falcon
quarkus.mongodb.connection-string=${MONGO_URI}
# Bounded driver budget (Season Capacity Plan, Appendix D §3, after the
# 2026-10-12 saturation). Batch job: tolerant selection and a long read
# timeout for sweeps, but a small pool and no idle pre-warm so it never
# competes with viewer/plugins-api for connections. Was min-pool-size=5.
quarkus.mongodb.server-selection-timeout=10S
quarkus.mongodb.connect-timeout=5S
quarkus.mongodb.read-timeout=120S
quarkus.mongodb.max-pool-size=3
quarkus.mongodb.min-pool-size=0
# Pool wait (driver maxWaitTime), applied by MongoClientTuning: no
# quarkus.mongodb.* property exists for it.
remotefalcon.mongodb.wait-queue-timeout=10S
# Keep Mongo out of /q/health/ready (the SmallRye check also opened an unused
# reactive client and pool). Build-time property.
quarkus.mongodb.health.enabled=false
# Match the viewer's UUID representation so any future archive sweep that
# reads pages doesn't trip BSONException on subtype-3 pageIds written by
# Spring Data Mongo. Closing the asymmetry at the config layer.
quarkus.mongodb.uuid-representation=JAVA_LEGACY

#Component Scans
quarkus.index-dependency.remote-falcon-library.group-id=com.remotefalcon
quarkus.index-dependency.remote-falcon-library.artifact-id=remote-falcon-library

#OpTel
quarkus.otel.metrics.enabled=true
quarkus.application.name=remote-falcon-account-archive