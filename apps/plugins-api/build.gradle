plugins {
    id 'java'
    id 'io.quarkus'
    id 'jacoco'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-mongodb-panache'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-undertow'
    implementation 'org.apache.commons:commons-lang3:3.x'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation('com.remotefalcon:remote-falcon-library:1.0.0-LOCAL') {
        exclude group: "org.springframework.boot", module: "spring-boot-starter-data-mongodb"
    }
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation "io.quarkus:quarkus-micrometer"
    implementation "io.quarkus:quarkus-micrometer-registry-prometheus"
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.quarkus:quarkus-test-mongodb'
    testImplementation 'org.testcontainers:mongodb:1.19.8'
    testImplementation 'io.quarkus:quarkus-jacoco'
}

group 'com.remotefalcon'
version '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    // Capture @QuarkusTest coverage. Quarkus loads app classes in its own
    // classloader, so the plain Gradle JaCoCo agent never attributes their
    // execution — service classes registered 0% no matter how many
    // @QuarkusTest cases hit them (the reason the bundle floor sat at 5%).
    // The quarkus-jacoco extension instruments inside the QuarkusClassLoader
    // and appends to the same data file the agent writes for plain unit
    // tests; the agent is told to skip Quarkus-loaded classes to avoid
    // double instrumentation.
    jacoco {
        excludeClassLoaders = ["*QuarkusClassLoader"]
        destinationFile = layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile
    }
    systemProperty "quarkus.jacoco.data-file", layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile.absolutePath
    systemProperty "quarkus.jacoco.reuse-data-file", "true"
    // Skip the extension's own HTML report — jacocoTestReport is canonical.
    systemProperty "quarkus.jacoco.report", "false"
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    executionData.setFrom(layout.buildDirectory.file("jacoco-quarkus.exec"))
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.required.set(true)
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    executionData.setFrom(layout.buildDirectory.file("jacoco-quarkus.exec"))
    violationRules {
        rule {
            // History: the original 60%/60% Sprint 1 gate was re-baselined to
            // 5%/2% on 2026-05-24 and BRANCH again to 1% on 2026-06-24 —
            // each time because JaCoCo couldn't see @QuarkusTest coverage
            // (in-JVM Quarkus classloader), so heavily-tested service code
            // registered 0% and dragged the bundle ratio toward the floor.
            //
            // 2026-07-16 (#130): the real fix landed — quarkus-jacoco now
            // captures @QuarkusTest coverage (see the test block), so these
            // numbers finally measure the actual test suite. Floors are kept
            // at the old values in this commit purely to observe the first
            // honest CI measurement; the ratchet-up to lock it in follows
            // immediately. #152 tracks the same uplift for mongo-backup.
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.05
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.01
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

test.finalizedBy jacocoTestReport


compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
