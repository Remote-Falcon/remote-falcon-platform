quarkus.package.jar.enabled=true
quarkus.http.root-path=/
quarkus.http.port=8080
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
# Worker pool cap, ~3x the Mongo pool (15). The default (max(200, 8 x cores))
# let every blocked request pile onto the DB; excess now queues briefly or
# fails fast on the 1s pool wait.
quarkus.thread-pool.max-threads=48
#MongoDB
quarkus.mongodb.database=remote-falcon
quarkus.mongodb.connection-string=${MONGO_URI}
# Fail fast instead of queueing (Season Capacity Plan, Appendix D §3, after
# the 2026-10-12 saturation). Driver defaults were 30s server selection, 10s
# connect, no read timeout, 100-connection pool and a 2-minute pool wait, so
# every worker thread parked on a slow DB while the plugin (10s client
# timeout) had already retried. Pool size bounds this pod's share of the DB
# connection budget; min 2 keeps a warm connection without a reconnect storm
# on recovery (was 5, PERF-FIX-PLAN.md Fix 4).
quarkus.mongodb.server-selection-timeout=2S
quarkus.mongodb.connect-timeout=2S
# Read timeout stays under the plugin's 10s client timeout but well above a
# slow dequeue write, so a write Mongo applies is not reported as failed.
quarkus.mongodb.read-timeout=8S
quarkus.mongodb.max-pool-size=15
quarkus.mongodb.min-pool-size=2
# Pool wait (driver maxWaitTime). No quarkus.mongodb.* property exists for it,
# so MongoClientTuning applies this at runtime. This is the bulkhead.
remotefalcon.mongodb.wait-queue-timeout=1S
# MONGO_SLOW log line threshold (SlowCommandListener). 0 disables.
remotefalcon.mongodb.slow-command-threshold=250ms
# Circuit breaker around ShowRepository and PluginService (Season Prep S5b,
# Appendix D P2-2; MongoCircuitBreaker). Off by default; runtime config, so a
# deploy can flip it without a rebuild. Opens after failure-ratio of the last
# request-volume-threshold calls failed with a driver timeout, rejects calls
# with the usual 503 + Retry-After for delay, then closes after
# success-threshold good trial calls.
remotefalcon.mongodb.circuit-breaker.enabled=${MONGO_CIRCUIT_BREAKER_ENABLED:false}
remotefalcon.mongodb.circuit-breaker.request-volume-threshold=${MONGO_CIRCUIT_BREAKER_REQUEST_VOLUME:20}
remotefalcon.mongodb.circuit-breaker.failure-ratio=${MONGO_CIRCUIT_BREAKER_FAILURE_RATIO:0.5}
remotefalcon.mongodb.circuit-breaker.delay=${MONGO_CIRCUIT_BREAKER_DELAY_MS:10000}ms
remotefalcon.mongodb.circuit-breaker.success-threshold=${MONGO_CIRCUIT_BREAKER_SUCCESS_THRESHOLD:3}
# Keep Mongo out of /q/health/ready. The SmallRye check pinged a reactive
# client nothing else uses (a second pool per pod) and marked every pod
# unready while the DB was slow. Build-time property: needs the rebuild every
# deploy does anyway.
quarkus.mongodb.health.enabled=false
# Pool gauges (checked-out, wait queue) on /q/metrics via Micrometer.
quarkus.mongodb.metrics.enabled=true
# Match the viewer's UUID representation. ShowRepository.findByShowToken
# currently excludes the `pages` projection so the BSONException on subtype-3
# pageIds (written by Spring Data Mongo) doesn't surface yet — but any future
# path that reads pages without that exclude would NPE the entire request.
# Closing the asymmetry at the config layer so the bug can't reappear.
quarkus.mongodb.uuid-representation=JAVA_LEGACY
#Component Scans
quarkus.index-dependency.remote-falcon-library.group-id=com.remotefalcon
quarkus.index-dependency.remote-falcon-library.artifact-id=remote-falcon-library
#OpTel — ship OTLP/gRPC to a cluster-local OTel Collector (the modern
# replacement for the now-retired Datadog Agent the previous maintainer
# pointed this at). The collector owns auth + protocol conversion + routing
# to the cloud destination (PostHog Logs over HTTP).
#
# OTEL_URI defaults to the local compose collector; prod k8s overrides
# it to the in-cluster service DNS name.
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_URI:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.resource.attributes=service.name=remote-falcon-plugins-api,deployment.environment=prod
quarkus.application.name=remote-falcon-plugins-api

# Surface exporter failures (drops, timeouts, etc.) at WARN. The previous
# maintainer had this at OFF, which is exactly why the broken Datadog
# pipeline ran silently for an unknown stretch of time.
quarkus.log.category."io.quarkus.opentelemetry.runtime".level=WARN

#CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*
sequence.limit:500

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# Per-show-token rate limit (Season Capacity Plan R2, Appendix D P2-3),
# per pod, one bucket per endpoint and token. RateLimitFilter.
# off | log | enforce. log never rejects: one RATE_LIMIT WARN line per token
# and endpoint per minute while over the limit. enforce answers 429 +
# Retry-After. Runtime config: change the env var and restart.
plugins-api.rate-limit.mode=${PLUGINS_RATE_LIMIT_MODE:log}
# Limits sit well above normal traffic and only catch runaway loops.
# Interrupt-mode polls run ~1/s on older plugins (2s floor on current ones).
plugins-api.rate-limit.poll.per-minute=120
plugins-api.rate-limit.poll.burst=30
# Normally a few per show per day; one broken install looped it at 1/s.
plugins-api.rate-limit.sync.per-minute=6
plugins-api.rate-limit.sync.burst=3
# Every other endpoint (heartbeat ~2/min, updateWhatsPlaying and
# updateNextScheduledSequence about once per sequence).
plugins-api.rate-limit.other.per-minute=60
plugins-api.rate-limit.other.burst=30
# Memory bound. ~2,600 shows x ~6 endpoints fits easily. A full map first
# purges buckets idle this long (and refilled), then fails open.
plugins-api.rate-limit.max-entries=50000
plugins-api.rate-limit.idle-ttl-ms=600000