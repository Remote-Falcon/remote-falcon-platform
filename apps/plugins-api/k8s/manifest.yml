---
apiVersion: v1
kind: Namespace
metadata:
  name: #{Namespace}#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  labels:
    app: #{Application}#
spec:
  # No `replicas:` on purpose: the HPA below owns the replica count. With the
  # field set, every `kubectl apply` from deploy.yml snapped a scaled-out
  # Deployment back to the HPA minimum, mid-show if that is when the deploy
  # ran (Appendix D P0-3). A first-time create defaults to 1 and the HPA
  # raises it to minReplicas on its next sync (~15s).
  selector:
    matchLabels:
      app: #{Application}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{Application}#
    spec:
      # Same spread rule as control-panel: don't stack replicas on one node.
      # ScheduleAnyway = prefer spreading but never block scheduling on a
      # small/busy cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: #{Application}#
      containers:
        - name: #{Application}#
          image: #{Image}#
          resources:
            requests:
              memory: #{Requests.Memory}#
              cpu: #{Requests.CPU}#
            limits:
              memory: #{Limits.Memory}#
              cpu: #{Limits.CPU}#
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-connection
                  key: MONGO_URI
            # Point OTel exporter at the in-cluster collector (DaemonSet
            # in this namespace; see ops/k8s/otel-collector/). Overrides
            # the build-time-baked OTEL_URI from the GH org secret (which
            # still holds a stale legacy value pointing at a now-dead IP).
            # application.properties reads ${OTEL_URI:default}.
            - name: OTEL_URI
              value: "http://otel-collector.remote-falcon.svc.cluster.local:4317"
          # Probes never touch Mongo (quarkus.mongodb.health.enabled=false). A slow
          # DB must not mark every pod unready or stop new pods from starting
          # (2026-10-12 incident). Request-level timeouts surface DB trouble instead.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 3
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 3
            failureThreshold: 6
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 3
            failureThreshold: 6
            periodSeconds: 5
      imagePullSecrets:
        - name: remote-falcon-ghcr
---
apiVersion: v1
kind: Service
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  labels:
    app: #{Application}#
spec:
  type: ClusterIP
  selector:
    app: #{Application}#
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: #{Application}#
  namespace: default
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - #{Namespace}#
  selector:
    matchLabels:
      app: #{Application}#
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Appendix D P0-5. /nextPlaylistInQueue?updateQueue=true is a MUTATING
    # GET (it $pulls the request), and nginx treats GET as idempotent, so
    # the default "error timeout" re-sent it to another pod on an upstream
    # timeout: load amplification plus a possible double dequeue. Retry only
    # on connect errors. The plugin gives up at 10s, so don't keep the
    # upstream request alive for the default 60s after it has gone.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "12"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
spec:
  tls:
    - hosts:
        - #{Host}#
      secretName: remote-falcon-tls
  rules:
    - host: #{Host}#
      http:
        paths:
          - pathType: ImplementationSpecific
            path: /remote-falcon-plugins-api(/|$)(.*)
            backend:
              service:
                name: #{Application}#
                port:
                  number: 8080
          - pathType: ImplementationSpecific
            path: /remotefalcon/api(/|$)(.*)
            backend:
              service:
                name: #{Application}#
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{Application}#
  minReplicas: #{Replicas.Min}#
  maxReplicas: #{Replicas.Max}#
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
  # Damp the HPA (Appendix D P1-3, same shape as control-panel). Without a
  # behavior block the k8s default adds up to +100%/+4 pods per 15s, and
  # during a Mongo stall CPU RISES (timeouts, exception logging, TLS
  # reconnects), so the HPA piled on pods that each opened new connection
  # pools against the struggling DB. 1 pod/min up, slow scale-down.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Per-app disruption budget so a node drain always leaves one replica
# serving. Safe now that the HPA floor is 2 (Appendix D P0-4); a PDB with
# minAvailable 1 on a 1-replica deployment would block drains outright.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: #{Application}#
