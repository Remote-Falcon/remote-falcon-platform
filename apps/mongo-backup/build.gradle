plugins {
    id 'java'
    id 'io.quarkus' version '3.28.2'
    id 'co.uzzu.dotenv.gradle' version '4.0.0'
    id 'jacoco'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation platform('io.quarkiverse.amazonservices:quarkus-amazon-services-bom:3.9.1')
    implementation platform('software.amazon.awssdk:bom:2.29.41')
    implementation 'io.quarkus:quarkus-mongodb-panache'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkiverse.amazonservices:quarkus-amazon-s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'io.micrometer:micrometer-observation:1.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:mongodb:1.20.4'
    testImplementation 'org.testcontainers:localstack:1.20.4'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'io.quarkus:quarkus-jacoco'
}

group = 'com.remotefalcon'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    finalizedBy jacocoTestReport
    // Capture @QuarkusTest coverage. Quarkus loads app classes in its own
    // classloader, so the plain Gradle JaCoCo agent never fully attributes
    // their execution — the resource package registered 0% and the service
    // package under-read. The quarkus-jacoco extension instruments inside
    // the QuarkusClassLoader and appends to the same data file the agent
    // writes; the agent skips Quarkus-loaded classes to avoid double
    // instrumentation. Same fix as plugins-api (#130); closes out #152.
    jacoco {
        excludeClassLoaders = ["*QuarkusClassLoader"]
        destinationFile = layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile
    }
    systemProperty "quarkus.jacoco.data-file", layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile.absolutePath
    systemProperty "quarkus.jacoco.reuse-data-file", "true"
    // Skip the extension's own HTML report — jacocoTestReport is canonical.
    systemProperty "quarkus.jacoco.report", "false"
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    executionData.setFrom(layout.buildDirectory.file("jacoco-quarkus.exec"))
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.required.set(true)
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    executionData.setFrom(layout.buildDirectory.file("jacoco-quarkus.exec"))
    violationRules {
        rule {
            element = 'PACKAGE'
            // History: 2026-05-24 dropped `com.remotefalcon.resource` from
            // scope (registered 0% — Quarkus classloader kept JaCoCo from
            // attributing it) and lowered the service floor 80% → 65%
            // (measured 67%).
            //
            // 2026-07-16 (#152 close-out): quarkus-jacoco capture (see the
            // test block) made the numbers honest, which showed the resource
            // package genuinely had no tests — added BackupResourceTest (HTTP
            // level), BackupResourceUnitTest (guard + catch paths), and a
            // restore round-trip. Measured after: service 94%, resource 100%.
            // Floor restored to the original 80% on both packages.
            includes = ['com.remotefalcon.service', 'com.remotefalcon.resource']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
