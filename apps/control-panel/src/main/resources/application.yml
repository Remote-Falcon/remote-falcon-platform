spring:
  application:
    name: remote-falcon-control-panel
  main:
    web-application-type: servlet
  task:
    scheduling:
      pool:
        # Default is 1 thread, which serializes the every-minute FPP-health
        # alert task behind the multi-minute 03:00 retention sweep.
        size: 2
  data:
    mongodb:
      database: ${MONGO_DATABASE:remote-falcon}
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server:
  servlet:
    contextPath: /remote-falcon-control-panel
  port: 8080

info:
  build:
    artifact: remote-falcon-control-panel

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      cors:
        allowed-origins: "*"
        allowed-methods: "OPTIONS, GET, POST, PUT, DELETE"
        allowed-headers: "*"
  health:
    mongo:
      timeout: 3s

sendgrid:
  mail-from: "noreply@remotefalcon.com"

mailersend:
  template-ids:
    sign-up: ${MAILERSEND_TEMPLATE_SIGN_UP:v69oxl59ndrg785k}
    forgot-password: ${MAILERSEND_TEMPLATE_FORGOT_PASSWORD:ynrw7gy02w2l2k8e}
    request-api-access: ${MAILERSEND_TEMPLATE_REQUEST_API_ACCESS:yzkq340rd104d796}

mailer:
  # When true, EmailUtil.sendEmail short-circuits with a synthetic 202 instead
  # of calling MailerSend. Used by ops/docker-compose.dev.yml + the regression
  # e2e workflow so flows that depend on a successful email path (forgot
  # password) work without a real key. NEVER set true in production.
  dev-bypass: ${MAILER_DEV_BYPASS:false}

images:
  s3:
    bucket: ${IMAGES_S3_BUCKET:remote-falcon-uploads}
  cdn:
    endpoint: ${IMAGES_CDN_ENDPOINT:https://remote-falcon-uploads.nyc3.cdn.digitaloceanspaces.com}

logging:
  level:
    org:
      springframework:
        graphql: OFF #Turn off logging for Spring GraphQL

expo-push-url: https://exp.host/--/api/v2/push/send

# RF Page Builder integration (PRD External Viewer Page API, Phase 1).
# Shared HS256 secret with external-api's session-exchange endpoint —
# rotate via coordinated env update on both deployments. Must be ≥32 chars.
# The placeholder default unblocks local dev + tests; production override
# lives in the cluster Secret.
rfpb:
  launch:
    secret: ${RF_RFPB_LAUNCH_SECRET:dev-launch-secret-32-chars-or-more!}
    ttl-seconds: ${RF_RFPB_LAUNCH_TTL_SECONDS:300}
  page-builder-url: ${RFPB_BASE_URL:https://rfpagebuilder.com}

# 2FA (PRD 2FA-TOTP). secret-key encrypts TOTP secrets at rest (AES-GCM)
# and is deliberately DISTINCT from the JWT signing key. It is OPTIONAL:
# when unset, startMfaEnrollment returns MFA_NOT_CONFIGURED and nothing
# else changes — deployments (esp. self-host) opt in by setting it.
# Checked at call time, never via conditional beans (native-image strips
# beans gated on runtime-only env — see issue #160).
mfa:
  secret-key: ${MFA_SECRET_KEY:}
  # Zero or more previous secret-key values (comma-separated), kept ONLY so
  # their stored ciphertext still decrypts across a key rotation. To rotate:
  # set the new key as secret-key, move the old one here, run the
  # adminRotateMfaKeys mutation to re-encrypt every secret onto the new key,
  # then drop it from here. Never used to encrypt.
  secret-key-retired: ${MFA_SECRET_KEY_RETIRED:}
  pending-token-minutes: ${MFA_PENDING_TOKEN_MINUTES:5}
