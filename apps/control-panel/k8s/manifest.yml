---
apiVersion: v1
kind: Namespace
metadata:
  name: #{Namespace}#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  labels:
    app: #{Application}#
spec:
  # No `replicas:` on purpose: the HPA below owns the replica count. With the
  # field set, every `kubectl apply` from deploy.yml snapped a scaled-out
  # Deployment back to the HPA minimum, mid-show if that is when the deploy
  # ran (Appendix D P0-3). A first-time create defaults to 1 and the HPA
  # raises it to minReplicas on its next sync (~15s).
  selector:
    matchLabels:
      app: #{Application}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{Application}#
    spec:
      # B-2 (2026-08-22 audit): don't stack both replicas on one node.
      # ScheduleAnyway = prefer spreading but never block scheduling on a
      # small/busy cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: #{Application}#
      containers:
      - name: #{Application}#
        image: #{Image}#
        resources:
          requests:
            memory: #{Requests.Memory}#
            cpu: #{Requests.CPU}#
          limits:
            memory: #{Limits.Memory}#
            cpu: #{Limits.CPU}#
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: #{Env}#
        - name: AUTO_VALIDATE_EMAIL
          value: "false"
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: mongo-uri
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: github-pat
        - name: SENDGRID_KEY
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: sendgrid-key
        - name: MAILERSEND_TEMPLATE_SIGN_UP
          value: "v69oxl59ndrg785k"
        - name: MAILERSEND_TEMPLATE_FORGOT_PASSWORD
          value: "ynrw7gy02w2l2k8e"
        - name: MAILERSEND_TEMPLATE_REQUEST_API_ACCESS
          value: "yzkq340rd104d796"
        - name: JWT_USER
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: jwt-user
        # 2FA (PRD 2FA-TOTP) — AES-GCM key for TOTP secrets at rest,
        # deliberately distinct from jwt-user. optional:true so pods keep
        # starting before the key is added to the Secret; until it exists,
        # startMfaEnrollment returns MFA_NOT_CONFIGURED and nothing else
        # changes. Add via:
        #   kubectl -n remote-falcon patch secret remote-falcon-control-panel \
        #     -p "{\"stringData\":{\"mfa-secret-key\":\"$(openssl rand -base64 32)\"}}"
        - name: MFA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: mfa-secret-key
              optional: true
        # Rotation only: previous mfa-secret-key value(s), comma-separated, so
        # existing enrollments still decrypt while rotating. Set the old key
        # here, run the adminRotateMfaKeys mutation, then remove it and restart.
        - name: MFA_SECRET_KEY_RETIRED
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: mfa-secret-key-retired
              optional: true
        - name: CLIENT_HEADER
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: client-header
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: s3-endpoint
        - name: S3_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: s3-accessKey
        - name: S3_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: s3-secretKey
        - name: IMAGES_S3_BUCKET
          value: remote-falcon-uploads
        - name: IMAGES_CDN_ENDPOINT
          value: https://remote-falcon-uploads.nyc3.cdn.digitaloceanspaces.com
        - name: RF_RFPB_LAUNCH_SECRET
          valueFrom:
            secretKeyRef:
              name: remote-falcon-control-panel
              key: rfpb-launch-secret
        - name: RFPB_BASE_URL
          value: https://rfpagebuilder.com
        # Resilience P0-1 (2026-10-12 incident): probes use the Spring Boot
        # liveness/readiness groups, which do NOT include Mongo, so a slow DB
        # cannot mark every replica unready at once or restart-loop the pods.
        # Request-level fail-fast (driver timeouts in MongoConfig) surfaces DB
        # trouble instead. Plain /remote-falcon-control-panel/actuator/health (with Mongo) stays
        # available for humans. Startup gets up to 5 min for a native boot.
        startupProbe:
          httpGet:
            path: /remote-falcon-control-panel/actuator/health/liveness
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /remote-falcon-control-panel/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /remote-falcon-control-panel/actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
        - name: remote-falcon-ghcr
---
apiVersion: v1
kind: Service
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  type: ClusterIP
  ports:
  - port: 8080
  selector:
    app: #{Application}#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "3m"
    # Kept at nginx's 60s default: heavy stats exports and dashboard
    # aggregations on large shows can legitimately take 20-60s, and a 504
    # there only makes the operator retry the same expensive query.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
  - hosts:
    - #{Host}#
    secretName: remote-falcon-tls
  rules:
  - host: #{Host}#
    http:
      paths:
      - pathType: Prefix
        path: /remote-falcon-control-panel
        backend:
          service:
            name: #{Application}#
            port:
              number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{Application}#
  minReplicas: #{Replicas.Min}#
  maxReplicas: #{Replicas.Max}#
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Damp the HPA. Utilization is measured against the REQUEST (200m), and the
  # dashboard's 5s polls are spiky, so without a scale-down window the HPA
  # flaps replicas on every poll burst. Scale up fast (1 pod/min, no wait),
  # scale down slowly (1 pod / 2 min after a 5-min quiet window).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# B-2 (2026-08-22 audit): per-app disruption budget so a node drain always
# leaves at least one replica serving. Every service whose floor is >= 2
# replicas gets one (ui, gateway, control-panel, external-api, and since
# Appendix D P0-4 viewer + plugins-api). Single-replica services
# (mongo-backup, account-archive) still don't: a PDB with minAvailable on a
# 1-replica deployment blocks drains outright.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{Application}#
  namespace: #{Namespace}#
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: #{Application}#
